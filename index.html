<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10384b">
<meta name="description" content="Friendly abacus skills and mental mathematics adventures.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NECUZAH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>NECUZAH Super Abacus</title>

<style>
:root{--navy:#10384b;--teal:#1b655f;--gold:#ffbf58;--cream:#fff9e9;--ink:#19384e;--muted:#c7e0e7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--navy);color:var(--ink)}
body{min-height:100dvh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--navy),var(--teal));color:white;padding:12px 14px 10px;box-shadow:0 4px 16px #071e2b44;position:relative;z-index:2}
.headrow{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:950;letter-spacing:1px;font-size:1rem}.subtitle{font-size:.78rem;opacity:.85;margin-top:3px}
.status{font-size:.75rem;background:#ffffff18;border:1px solid #ffffff38;border-radius:999px;padding:6px 9px;white-space:nowrap}
nav{max-width:1200px;margin:10px auto 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;border-radius:11px;padding:10px 13px;background:#e7f0f5;color:#294d61;font:inherit;font-size:.88rem;font-weight:850;cursor:pointer}
nav button.active{background:var(--gold);color:#573b1d}
nav button:focus-visible{outline:3px solid white;outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:1240px;margin:0 auto;padding:10px 12px 0;min-height:0}
.module-info{color:var(--muted);font-size:.78rem;margin:0 2px 8px;line-height:1.4}
.framewrap{flex:1;min-height:0;background:var(--cream);border-radius:16px 16px 0 0;padding:5px;box-shadow:0 5px 0 #071e2b30;overflow:hidden}
iframe{display:block;width:100%;height:calc(100dvh - 230px);min-height:380px;border:0;border-radius:12px;background:var(--cream)}
footer{text-align:center;color:var(--muted);font-size:.72rem;padding:8px 12px 10px}
.homebar{max-width:1200px;margin:0 auto 8px;width:100%;padding:0 14px;display:flex;gap:8px}
.home-button{border:0;border-radius:11px;padding:9px 13px;background:var(--gold);color:#573b1d;font:inherit;font-size:.86rem;font-weight:900;cursor:pointer}
.home-button:focus-visible{outline:3px solid white;outline-offset:2px}
@media(min-width:800px){header{padding:14px 24px 10px}main{padding:12px 18px 0}.subtitle{font-size:.82rem}iframe{height:calc(100dvh - 235px);min-height:500px}}
@media(max-width:420px){header{padding:10px 10px 8px}.brand{font-size:.88rem}.subtitle{font-size:.7rem}.status{font-size:.66rem;padding:5px 7px}nav{margin-top:9px}nav button{padding:9px 11px;font-size:.82rem}main{padding:7px 7px 0}.module-info{font-size:.72rem}iframe{height:calc(100dvh - 225px);min-height:340px}.homebar{padding:0 10px}}
</style>
</head>

<body>
<header>
  <div class="headrow">
    <div>
      <div class="brand">🌟 NECUZAH SUPER ABACUS</div>
      <div class="subtitle">Abacus skills · Mental mathematics · Adventure learning</div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Opening Adventure…</div>
  </div>
  <nav aria-label="Learning activities">
    <button class="active" type="button" data-src="NECUZAH_Adventure_Connected_v2.html" data-label="Adventure">🗺️ Adventure</button>
    <button type="button" data-src="rod-training.html" data-label="Rod Training">🧮 Rod Training</button>
    <button type="button" data-src="NECUZAH_Talking_Hybrid_Abacus_v5.html" data-label="Talking Abacus">🎙️ Talking Abacus</button>
  </nav>
</header>

<div class="homebar">
  <button class="home-button" id="homeButton" type="button">⌂ Home</button>
</div>

<main>
  <p class="module-info">Choose Adventure, Rod Training, or Talking Abacus above. Use Home to return to Adventure.</p>
  <section class="framewrap">
    <iframe id="game" title="NECUZAH Adventure learning activity" src="NECUZAH_Adventure_Connected_v2.html" allow="microphone"></iframe>
  </section>
</main>

<footer>NECUZAH Super Abacus · One interface · Separate modules so each can be improved safely</footer>

<script>
(() => {
  'use strict';

  const frame = document.getElementById('game');
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('nav button')];
  const homeButton = document.getElementById('homeButton');
  let active = buttons[0];

  function setModule(btn) {
    active = btn;

    buttons.forEach(button => {
      const selected = button === btn;
      button.classList.toggle('active', selected);
      button.setAttribute('aria-current', selected ? 'page' : 'false');
    });

    status.textContent = 'Opening ' + btn.dataset.label + '…';
    frame.title = 'NECUZAH ' + btn.dataset.label;

    if (frame.getAttribute('src') !== btn.dataset.src) {
      frame.src = btn.dataset.src;
    } else {
      status.textContent = btn.dataset.label + ' selected';
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => setModule(btn));
  });

  homeButton.addEventListener('click', () => {
    setModule(buttons[0]);
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  frame.addEventListener('load', () => {
    status.textContent = active.dataset.label + ' ready';
  });

  frame.addEventListener('error', () => {
    status.textContent = 'Could not load module. Check its filename in GitHub.';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('NECUZAH service worker registered.'))
        .catch(error => console.error('Service worker registration failed:', error));
    });
  }
})();
</script>
</body>
</html>
