
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NECUZAH 3D Road Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #102b3a;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 16px;
      text-align: center;
      background: #10384b;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 5px 0; }
    #viewer {
      width: 100%;
      height: 72vh;
      min-height: 350px;
      display: block;
      background: #b9e6ff;
    }
    .message {
      padding: 14px;
      text-align: center;
      line-height: 1.5;
    }
    button {
      background: #f5c542;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>NECUZAH Super Racing</h1>
    <p>3D Road Preview</p>
  </header>

  <canvas id="viewer"></canvas>

  <div class="message">
    <p id="status">Loading the 3D road model...</p>
    <button onclick="location.href='../index.html'">
      Return to Home
    </button>
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const canvas = document.getElementById('viewer');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9e6ff);
    scene.fog = new THREE.Fog(0xb9e6ff, 30, 100);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
    camera.position.set(8, 8, 12);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x607060, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);

    const grid = new THREE.GridHelper(100, 50, 0x527080, 0x8da4ad);
    scene.add(grid);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x719b56 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    scene.add(ground);

    const loader = new GLTFLoader();

    loader.load(
      '../necuzah-road.glb',
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        model.position.sub(center);

        const maxDimension = Math.max(size.x, size.y, size.z);
        if (maxDimension > 0) {
          const scale = 12 / maxDimension;
          model.scale.setScalar(scale);
        }

        camera.position.set(12, 10, 15);
        camera.lookAt(0, 0, 0);

        status.textContent =
          'Road model loaded. Drag to inspect it using your mouse or finger.';
      },
      undefined,
      (error) => {
        console.error(error);
        status.textContent =
          'The model could not load. Check the model filename, its GitHub location, and your internet connection.';
      }
    );

    function resize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height) return;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
