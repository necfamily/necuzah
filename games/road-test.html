<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10384b">
  <title>NECUZAH 3D Road Test</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #102b3a; color: white; font-family: Arial, sans-serif; }
    header { padding: 16px; text-align: center; background: #10384b; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 5px 0; }
    #viewer { width: 100%; height: 72vh; height: 72dvh; min-height: 320px; display: block; background: #b9e6ff; }
    .message { padding: 14px; text-align: center; line-height: 1.5; overflow-wrap: anywhere; }
    button { background: #f5c542; color: #102b3a; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: bold; cursor: pointer; }
    #status { white-space: pre-wrap; }
    @media (max-width: 600px) { #viewer { height: 65dvh; min-height: 300px; } }
  </style>
</head>
<body>
  <header><h1>NECUZAH Super Racing</h1><p>3D Road Preview</p></header>
  <canvas id="viewer" aria-label="Interactive 3D road preview"></canvas>
  <div class="message">
    <p id="status" role="status">Preparing the 3D viewer...</p>
    <button onclick="location.href='../index.html'">Return to Home</button>
  </div>
  <script type="module">
    const status = document.getElementById('status');
    const canvas = document.getElementById('viewer');
    const modelUrl = 'https://necfamily.github.io/necuzah/necuzah-road.glb';
    function showError(message) { status.textContent = message; }

    async function startViewer() {
      try {
        status.textContent = 'Starting 3D engine...';
        const THREE = await import('three');
        const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb9e6ff);
        const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 10000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        scene.add(new THREE.HemisphereLight(0xffffff, 0x647060, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(10, 20, 10);
        scene.add(sun);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x719b56 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        function resize() {
          const width = canvas.clientWidth, height = canvas.clientHeight;
          if (!width || !height) return;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }
        window.addEventListener('resize', resize);
        resize();
        status.textContent = 'Loading the 3D road model...';
        const loader = new GLTFLoader();
        loader.load(modelUrl, (gltf) => {
          const model = gltf.scene;
          model.updateMatrixWorld(true);
          const bounds = new THREE.Box3().setFromObject(model);
          if (bounds.isEmpty()) {
            showError('The file opened, but it contains no visible 3D objects.');
            return;
          }
          const size = bounds.getSize(new THREE.Vector3());
          const center = bounds.getCenter(new THREE.Vector3());
          const maxDimension = Math.max(size.x, size.y, size.z);
          model.position.sub(center);
          if (maxDimension > 0) model.scale.setScalar(20 / maxDimension);
          scene.add(model);
          model.updateMatrixWorld(true);
          const fittedBounds = new THREE.Box3().setFromObject(model);
          const fittedSize = fittedBounds.getSize(new THREE.Vector3());
          const fittedCenter = fittedBounds.getCenter(new THREE.Vector3());
          const span = Math.max(fittedSize.x, fittedSize.y, fittedSize.z, 1);
          camera.near = 0.01;
          camera.far = span * 100;
          camera.position.set(fittedCenter.x + span * 1.1, fittedCenter.y + span * 0.9, fittedCenter.z + span * 1.4);
          camera.lookAt(fittedCenter);
          camera.updateProjectionMatrix();
          resize();
          showError('Road model loaded successfully.');
        }, (progress) => {
          if (progress.total > 0) status.textContent = `Loading the 3D road model... ${Math.round(progress.loaded / progress.total * 100)}%`;
        }, (error) => {
          console.error('GLB loading error:', error);
          showError('The viewer started, but the road model failed to load. Check the model link and refresh the page.');
        });
        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
      } catch (error) {
        console.error('3D viewer startup error:', error);
        showError('The 3D viewer could not start. Check your internet connection and refresh. If this message remains, the browser may be blocking the Three.js module.');
      }
    }
    startViewer();
  </script>
</body>
</html>
